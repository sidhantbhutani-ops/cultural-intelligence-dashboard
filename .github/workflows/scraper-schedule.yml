name: Daily Scraper Run

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC = 1:30 PM IST
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run scraper
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node -e "const {runScraper} = require('./src/scraper'); runScraper().then(r => console.log('✅ Completed:', r.trendsCreated, 'trends created')).catch(e => { console.error('❌ Failed:', e.message); process.exit(1); })"
