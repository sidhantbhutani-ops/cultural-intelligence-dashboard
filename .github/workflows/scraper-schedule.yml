name: Daily Scraper Run

on:
  schedule:
    # Run every day at 6 AM UTC (1:30 PM IST)
    - cron: '0 6 * * *'
  workflow_dispatch:  # Manual trigger from GitHub dashboard

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm install --omit=dev
      
      - name: Run scraper
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node -e "const {runScraper} = require('./src/scraper'); runScraper().then(r => console.log('✅ Completed:', r.trendsCreated, 'trends created')).catch(e => { console.error('❌ Failed:', e.message); process.exit(1); })"
      
      - name: Log results
        if: always()
        run: echo "Scraper job completed"
